name: CI

# Confirmed audit finding, fixed: this workflow previously still
# provisioned a MongoDB replica set and set MONGO_URI_TEST — stale from
# before this project's MongoDB -> MySQL/MariaDB migration. The actual test
# harness (scripts/assertTestDbSafety.mjs, tests/helpers/testDb.mjs) has
# required DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD for a MySQL/MariaDB
# database since that migration — as configured, this workflow's `pretest`
# gate (CI=true, so strict mode) would have hard-failed on a missing
# DB_NAME before a single test ever ran. Now provisions a real MariaDB
# service container and imports sql/schema.sql into it before testing,
# matching this project's actual runtime (InnoDB on a single standalone
# server — no replica set needed; MariaDB, not MySQL, to match the local
# dev/test setup documented in .env.test.example).
#
# Every job here uses ONLY isolated, CI-local test values defined directly
# in this file (see the `env:` block below) — nothing is pulled from
# repository secrets, and no step ever references a production database.
# This workflow triggers on `pull_request` (never `pull_request_target`),
# so a fork's PR branch never runs with access to any repository secret in
# the first place — and since no step here references `secrets.*` at all,
# there is nothing to expose even on a same-repo PR.
#
# scripts/assertTestDbSafety.mjs additionally enforces database isolation
# at runtime, inside the test run itself (checks DB_NAME's naming, refuses
# to match the real app's database name, refuses a non-localhost host
# unless explicitly confirmed, and — because CI=true/REQUIRE_TEST_DB=true
# below — hard-fails if the database is missing or not actually reachable/
# transaction-capable, rather than letting database-backed suites silently
# skip). scripts/assertNoCriticalSkips.mjs then inspects the captured test
# output and fails the job if any database-backed suite reported itself
# skipped anyway.

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-progress run for the same branch/PR when a new commit lands,
# so obsolete runs don't keep consuming runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job in this workflow — none of them
# need to write to the repo, open issues/PRs, or touch packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Phase 11, section M: bounds a hung test/build step (stuck server,
    # infinite test loop) to a fixed wall-clock ceiling instead of running
    # until GitHub's default 360-minute cap.
    timeout-minutes: 20

    env:
      NODE_ENV: test
      CI: "true"
      REQUIRE_TEST_DB: "true"
      # Local-to-this-job MariaDB service container (below), torn down
      # with the runner. Never points at anything outside this job. DB_NAME
      # deliberately ends in "_ci" — scripts/assertTestDbSafety.mjs refuses
      # to run against a database whose name doesn't end in "_test"/"_ci",
      # and separately refuses the one known real application database
      # name outright.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: ladies_multi_ecomm_ci
      DB_USER: root
      DB_PASSWORD: ci_root_password
      # JWT_SECRET/JWT_EXPIRES_IN were removed here as of the Phase 2
      # session-cookie migration (jsonwebtoken is uninstalled; nothing in
      # this codebase signs or verifies a JWT anymore) — no test file's
      # gate reads them anymore either, so they are no longer an executable
      # requirement, only a historical artifact of the old bearer-JWT setup.
      CLIENT_URL: http://localhost:3000

    # Runner-local MariaDB, matching the version documented in
    # .env.test.example (XAMPP MariaDB 10.4.28) closely enough for this
    # schema's needs (InnoDB, utf8mb4, JSON columns, window functions) —
    # pinned to a specific minor version, not `:latest`, so a CI run is
    # reproducible. GitHub Actions health-checks this automatically before
    # any step below runs, but the explicit `mysqladmin ping` step further
    # down still double-checks readiness the same way a real deployment's
    # own health check would, rather than assuming the service block's
    # healthcheck alone is sufficient.
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # Pinned to the v7.0.1 release commit (actions/checkout).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the v7.0.0 release commit (actions/setup-node). Node
      # version pinned to match package.json's "engines" field and this
      # project's actual local dev version exactly.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: "npm" # keys off package-lock.json automatically

      - name: Install dependencies
        run: npm ci

      - name: Wait for MariaDB and create the CI database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -pci_root_password --silent && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done
          mysql -h127.0.0.1 -P3306 -uroot -pci_root_password -e "CREATE DATABASE IF NOT EXISTS \`ladies_multi_ecomm_ci\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      # sql/schema.sql is entirely CREATE TABLE IF NOT EXISTS — safe to
      # import into a brand-new, empty database exactly like this one.
      - name: Import schema
        run: mysql -h127.0.0.1 -P3306 -uroot -pci_root_password ladies_multi_ecomm_ci < sql/schema.sql

      - name: Lint
        run: npm run lint

      # Captures output to a file (not just stdout) so the critical-skip
      # check below can inspect it — `set -o pipefail` is required so a
      # non-zero exit code still fails this step even through the `tee`
      # pipe. npm's `pretest` hook (scripts/assertTestDbSafety.mjs) runs
      # first and fails the job immediately if MONGO_URI_TEST is missing or
      # isn't actually reachable and transaction-capable — CI=true above
      # puts it in strict mode.
      - name: Test (core — database-backed suites)
        shell: bash
        run: |
          set -o pipefail
          npm run test:core 2>&1 | tee test-core-output.log

      # scripts/httpTestServer.mjs builds, seeds the same isolated MariaDB
      # database (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD above), starts
      # one `next start` server on a verified-free port pointed ONLY at that
      # database, runs tests/http/*.test.mjs against it, and always stops
      # the server afterward (success, failure, or interruption).
      - name: Test (HTTP integration suites)
        shell: bash
        run: |
          set -o pipefail
          npm run test:http 2>&1 | tee test-http-output.log

      # These two suites each own their own multi-instance server
      # lifecycle (two independent `next start` processes) and can never
      # actually execute inside the shared single-server harness above —
      # tests/http/multiInstanceEvents.integration.test.mjs and
      # tests/http/coldStartHomepage.integration.test.mjs both match that
      # harness's default glob and always report themselves SKIPPED there
      # (by design — see each script's own header comment), which is why
      # they need their own dedicated npm scripts and CI steps rather than
      # being expected to run via `npm run test:http` above. Captured to
      # their own log files so assertNoCriticalSkips.mjs below can confirm
      # they didn't ALSO skip here (which would mean the regression proof
      # never actually ran anywhere in CI).
      - name: Test (multi-instance realtime — mandatory cross-process proof)
        shell: bash
        run: |
          set -o pipefail
          npm run test:multi-instance 2>&1 | tee test-multi-instance-output.log

      - name: Test (cold-start homepage — mandatory DB-readiness regression proof)
        shell: bash
        run: |
          set -o pipefail
          npm run test:http:cold-start 2>&1 | tee test-cold-start-output.log

      - name: Verify no critical suites were skipped
        run: node scripts/assertNoCriticalSkips.mjs test-core-output.log test-http-output.log test-multi-instance-output.log test-cold-start-output.log

      - name: Build
        run: npm run build

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output
          path: |
            test-core-output.log
            test-http-output.log
            test-multi-instance-output.log
            test-cold-start-output.log
            .phase1-http-test-logs/
            .phase11-multi-instance-logs/
            .phase11-coldstart-logs/
          retention-days: 7
